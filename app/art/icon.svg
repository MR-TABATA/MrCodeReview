<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <!-- MrCodeReview（Pro）アイコン。無料版（ライム地に白抜き）と同じグリフ（レンズの中にチェック）を、
       MrkEditor / MrEditor / MrkDiff の Pro と同じ塗り分け（黒地＋ゴールドグリフ＋細い金の内枠）で。
       本体は canvas の 80.47%（macOS の規約。全面に描くと Dock で大きく見える）。無料版と同じ寸法・角丸。

       gradientUnits="userSpaceOnUse" は必須。既定の objectBoundingBox だと、要素ごとにグラデーションが変わり、
       レンズ・柄・チェックの金が揃わない（水平・垂直の線は、バウンディングボックスの幅か高さが 0 になり、描画されないこともある）。 -->
  <defs>
    <linearGradient id="blk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262f"/>
      <stop offset="1" stop-color="#08080c"/>
    </linearGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="20" x2="0" y2="80">
      <stop offset="0" stop-color="#ffe6a6"/>
      <stop offset="45%" stop-color="#f4b52a"/>
      <stop offset="100%" stop-color="#bf7d10"/>
    </linearGradient>
    <radialGradient id="gloss" cx="50%" cy="0%" r="80%">
      <stop offset="0" stop-color="#fff" stop-opacity=".14"/>
      <stop offset="55%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.6" flood-color="#0B1020" flood-opacity="0.30"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <g transform="translate(9.765 9.765) scale(0.8047)">
      <rect width="100" height="100" rx="23" fill="url(#blk)"/>
      <rect width="100" height="100" rx="23" fill="url(#gloss)"/>
      <rect x="6" y="6" width="88" height="88" rx="18" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity=".55"/>
      <g fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="42" cy="42" r="20"/>
        <line x1="57" y1="57" x2="74" y2="74"/>
        <polyline points="33,42 40,49 52,35" stroke-width="7"/>
      </g>
    </g>
  </g>
</svg>
