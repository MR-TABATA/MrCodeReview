<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <!-- MrCodeReview Dev アイコン（案B: 下部ピルバッジ・小文字 dev 拡大版）。
       虫眼鏡＋チェックマークを活かしつつ、下部バッジと「dev」文字を一回り大きくして
       Dock や小サイズでの視認性を強化。 -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C8E64C"/>
      <stop offset="1" stop-color="#4F8A10"/>
    </linearGradient>
    <radialGradient id="gloss" cx="50%" cy="0%" r="80%">
      <stop offset="0" stop-color="#fff" stop-opacity=".14"/>
      <stop offset="55%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.6" flood-color="#0B1020" flood-opacity="0.30"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <g transform="translate(9.765 9.765) scale(0.8047)">
      <rect width="100" height="100" rx="23" fill="url(#g)"/>
      <rect width="100" height="100" rx="23" fill="url(#gloss)"/>
      <!-- レンズ＋チェックマーク（バッジ拡大に合わせて 5px 上にシフト） -->
      <g transform="translate(0, -5)" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="42" cy="42" r="20"/>
        <line x1="57" y1="57" x2="74" y2="74"/>
        <polyline points="33,42 40,49 52,35" stroke-width="7"/>
      </g>
      <!-- 下部ピルバッジ（拡大: width 56, height 18.5, rx 9.25） -->
      <rect x="22" y="73" width="56" height="18.5" rx="9.25" fill="#142603" opacity="0.90"/>
      <!-- 小文字 dev（拡大: font-size 14.5px, bold 900） -->
      <text x="50" y="81.8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro', 'Helvetica Neue', sans-serif" font-size="14.5" font-weight="900" fill="#c8e64c" text-anchor="middle" dominant-baseline="central" letter-spacing="0.2px">dev</text>
    </g>
  </g>
</svg>
