[package]
name = "mrcr"
version = "0.2.0"
edition = "2021"
description = "AI code review CLI on your uncommitted changes"
license = "MIT"

[[bin]]
name = "mrcr"
path = "src/main.rs"

[dependencies]
mrcr-core = { path = "../mrcr-core" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
