[package]
name = "mrcr-core"
version = "1.6.0"
edition = "2021"
description = "Core engine for MrCodeReview - snapshot, recipe prompts, LLM providers, and verification"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.13.1"
ureq = { version = "2", features = ["json"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
